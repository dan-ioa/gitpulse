[project]
name = "gitpulse"
version = "0.1.0"
description = "GitPulse — a CrewAI crew that emails a daily digest of new open-source AI tools on GitHub"
authors = [{ name = "Daniel Ioannou", email = "daniel02.ioannou@gmail.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[file-processing,google-genai,litellm,tools]==1.14.4",
    "resend>=2.30.1",
]

[project.scripts]
gitpulse = "gitpulse.main:run"
run_crew = "gitpulse.main:run"
train = "gitpulse.main:train"
replay = "gitpulse.main:replay"
test = "gitpulse.main:test"
run_with_trigger = "gitpulse.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"

[tool.uv]
override-dependencies = ["litellm<=1.82.6"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
